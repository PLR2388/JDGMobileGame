name: Unity Tests

on:
  push:
    branches: [master, refactor-v3]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Run Unity Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Library folder
        uses: actions/cache@v4
        with:
          path: "JDG Mobile Game/Library"
          key: Library-${{ hashFiles('JDG Mobile Game/Assets/**', 'JDG Mobile Game/Packages/**', 'JDG Mobile Game/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: "JDG Mobile Game"
          unityVersion: 6000.0.60f1
          testMode: editmode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Unity Test Results
          coverageOptions: 'generateAdditionalMetrics;generateHtmlReport;generateBadgeReport'

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test Results
          path: artifacts

      - name: Upload coverage results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Coverage Results
          path: CodeCoverage
